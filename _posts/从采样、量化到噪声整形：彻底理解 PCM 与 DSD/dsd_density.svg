    <text x="1000" y="145" fill="#2563eb">1 较多</text><text x="1000" y="315" fill="#2563eb">约各一半</text><text x="1000" y="485" fill="#2563eb">0 较多</text>
  </g>
  <g transform="translate(190 95)" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round">
    <path d="M0 80V15H45V15H90V15H135V80H180V15H225V15H270V15H315V80H360V15H405V15H450V15H495V80H540V15H585V15H630V15H675V80H720V15H765V80"/>
    <path transform="translate(0 170)" d="M0 80V15H45V80H90V15H135V80H180V15H225V80H270V15H315V80H360V15H405V80H450V15H495V80H540V15H585V80H630V15H675V80H720V15H765V80"/>
    <path transform="translate(0 340)" d="M0 80V15H45V80H90V80H135V80H180V15H225V80H270V80H315V80H360V15H405V80H450V80H495V80H540V15H585V80H630V80H675V80H720V15H765V80"/>
  </g>
  <g stroke="#f97316" stroke-width="4" stroke-dasharray="10 8">
